# -- General --
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Allow panes to send OSC escape sequences to the outer terminal
# (required for oh-my-posh background-color detection to work without leaking)
set -g allow-passthrough on

# -- Feel --
set -g escape-time 10
set -g focus-events on

# -- Mouse --
set -g mouse on

# -- Indexing --
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
